<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            font: normal 20pt Arial;
        }
    </style>
</head>
<body>
    <script>
        var nome = window.prompt("Qual é o seu nome?")
        document.write(`Olá, <strong> ${nome} </strong> Seu nome tem ${nome.length} letras. <br>`)
        document.write(`Seu nome em maiusculas é ${nome.toUpperCase()}<br>`)
        document.write(`Seu nome em minusculas é ${nome.toLowerCase()}`)
    </script>
    <!--toFixed(2).replace('.',',')
    tofixed(2) -- significa que depois da virgula terá 2 casas 123.45
    replace -- nesse caso serve para trocar o ponto por vírgula
    
    toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'}) -- toda essa linha serve para colocar os sinais R$ na frente de um valor de salário por exemplo-->
</body>
</html>
